<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copyforge — Write copy that sounds like you</title>
  <meta name="description" content="Generate on-brand product descriptions and social posts using AI, based on your own brand voice guidelines.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="masthead">
      <span class="masthead-mark">Copyforge</span>
      <h1>Write copy that<br>sounds like you.</h1>
      <p class="masthead-sub">Describe your voice once. Get product descriptions and social posts that actually sound like your brand wrote them.</p>
    </header>

    <div class="hr"></div>

    <form id="generator-form" class="sheet">
      <div class="line-field">
        <label for="brand-voice">Brand voice</label>
        <textarea
          id="brand-voice"
          rows="2"
          placeholder="Playful and confident. Short sentences. No corporate jargon."
          required
        ></textarea>
      </div>

      <div class="line-field">
        <label>What are you writing?</label>
        <div class="choice-row">
          <label class="choice">
            <input type="radio" name="contentType" value="product_description" checked>
            <span>Product description</span>
          </label>
          <label class="choice">
            <input type="radio" name="contentType" value="social_post">
            <span>Social media post</span>
          </label>
        </div>
      </div>

      <div class="line-field" id="platform-field" style="display: none;">
        <label for="platform">Platform</label>
        <select id="platform">
          <option value="Instagram">Instagram</option>
          <option value="Twitter / X">Twitter / X</option>
          <option value="Facebook">Facebook</option>
          <option value="LinkedIn">LinkedIn</option>
          <option value="TikTok caption">TikTok caption</option>
        </select>
      </div>

      <div class="line-field">
        <label for="product-info">Tell us about it</label>
        <textarea
          id="product-info"
          rows="2"
          placeholder="Insulated stainless steel water bottle, $28, keeps drinks cold for 24 hours."
          required
        ></textarea>
      </div>

      <button type="submit" class="write-btn" id="generate-btn">
        <span class="btn-text">Write it</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>

      <p class="error-message" id="error-message" role="alert"></p>
    </form>

    <div class="hr"></div>

    <section class="result-area">
      <div class="output-empty" id="output-empty">
        <p>Your copy will appear here once it's written.</p>
      </div>

      <div class="output-page" id="output-result" style="display: none;">
        <div class="page-fold" aria-hidden="true"></div>
        <p id="output-text"></p>
        <button class="copy-link" id="copy-btn">
          <span id="copy-btn-text">Copy this</span>
        </button>
      </div>
    </section>

    <footer class="page-footer">
      <p>Built by Salman</p>
    </footer>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
